<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS / iPadOS 12 Fullscreen & Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lesson Library">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <title>Lesson Module Library - Dark Mode</title>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-user-select: none;
            user-select: none;
        }

        /* App Window Layout */
        .app-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Navigation with iOS Status Bar Clearance */
        .sidebar {
            width: 270px;
            min-width: 270px;
            height: 100%;
            background-color: #000000;
            padding: 12px;
            padding-top: 24px;
            padding-top: calc(12px + constant(safe-area-inset-top));
            padding-top: calc(12px + env(safe-area-inset-top, 20px));
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 20;
            transition: margin-left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar.collapsed {
            margin-left: -270px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-time {
            font-size: 11px;
            font-weight: 600;
            color: #f5f5f7;
            letter-spacing: -0.1px;
        }

        /* Custom Icon Button (Circular Fix for iPadOS 12) */
        .icon-btn {
            position: relative;
            background-color: rgba(200, 200, 200, 0.25);
            border: none;
            width: 30px;
            height: 30px;
            -webkit-border-radius: 50%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
            overflow: hidden;
            -webkit-appearance: none;
            -webkit-transition: transform 0.15s ease, background-color 0.2s ease;
            transition: transform 0.15s ease, background-color 0.2s ease;
              backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
        }

        .icon-btn::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            -webkit-border-radius: 50%;
            border-radius: 50%;
            padding: 1px;
            background: -webkit-linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.7),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.7)
            );
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.7),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.7)
            );
            -webkit-mask-image: -webkit-linear-gradient(#fff 0 0), -webkit-linear-gradient(#fff 0 0);
            -webkit-mask-image: linear-gradient(#fff 0 0), linear-gradient(#fff 0 0);
            -webkit-mask-clip: content-box, border-box;
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .icon-btn:hover {
            transform: scale(1.04);
            background-color: #3a3a3c;
        }

        .icon-btn svg {
            width: 14px;
            height: 14px;
            fill: #e5e5ea;
        }

        /* Card Grid Layout */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        /* Card Styling */
        .card {
            position: relative;
            background-color: rgba(200, 200, 200, 0.125);
            border-radius: 25px;
            padding: 12px;
            height: 125px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            cursor: pointer;
            -webkit-appearance: none;
            -webkit-transition: transform 0.15s ease, background-color 0.2s ease;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            -webkit-border-radius: 25px;
            border-radius: 25px;
            padding: 1px;
            background: -webkit-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.7) 0%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.7) 100%
            );
            background: linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.7) 0%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.7) 100%
            );
            -webkit-mask-image: -webkit-linear-gradient(#fff 0 0), -webkit-linear-gradient(#fff 0 0);
            -webkit-mask-image: linear-gradient(#fff 0 0), linear-gradient(#fff 0 0);
            -webkit-mask-clip: content-box, border-box;
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-1px);
        }

        .card.active {
            background-color: rgba(200, 200, 200, 0.25);
        }

        .card-tag {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
            display: block;
            line-height: 1.2;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        .card-full-bg {
            background-size: cover;
            background-position: center;
            color: #ffffff;
            min-height: 120px;
            justify-content: flex-start;
        }

        /* Main Content View Container */
        .content-view {
            flex: 1;
            height: 100%;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        /* Gradient Overlay Header with iOS Status Bar Clearance */
        .content-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;
            height: calc(64px + constant(safe-area-inset-top));
            height: calc(64px + env(safe-area-inset-top, 20px));
            padding: 0 16px;
            padding-top: 20px;
            padding-top: constant(safe-area-inset-top);
            padding-top: env(safe-area-inset-top, 20px);
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 60%, rgba(0, 0, 0, 0) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .content-header > * {
            pointer-events: auto;
        }

        .header-title {
            font-size: 13px;
            font-weight: 600;
            color: #f5f5f7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-left: auto;
        }

        /* ===== iPadOS 12 FIX: This wrapper is the scroller ===== */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
            z-index: 1;
            overflow: auto;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            -webkit-user-select: auto;
            user-select: auto;
            touch-action: pan-y;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        #content-frame {
            display: block;
            width: 1px;
            min-width: 100%;
            *width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="app-window">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="icon-btn" title="Filter Modules">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                    </svg>
                </button>
            </div>

            <div class="card-grid">
                <div class="card card-full-bg active" data-src="lacs.html" data-query="Life And Career Skills" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400&q=80');">
                    <span class="card-tag">Monday <br> 8:00 - 10:00</span>
                    <h3 class="card-title">Life And Career Skills</h3>
                </div>
                
                <div class="card card-full-bg" data-src="science.html" data-query="General Science" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400&q=80');">
                    <span class="card-tag">Monday <br> 10:15 - 12:15</span>
                    <h3 class="card-title">General Science</h3>
                </div>
                
                <div class="card card-full-bg" data-src="english.html" data-query="Effective Communication" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400&q=80');">
                    <span class="card-tag">Monday <br> 1:00 - 3:00</span>
                    <h3 class="card-title">Effective Communication</h3>
                </div>

                <div class="card card-full-bg" data-src="math.html" data-query="General Mathematics" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400&q=80');">
                    <span class="card-tag">Wednesday <br> 10:00 - 12:00</span>
                    <h3 class="card-title">General Mathematics</h3>
                </div>
                
                <div class="card card-full-bg" data-src="filipino.html" data-query="History of Filipino" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400&q=80');">
                    <span class="card-tag">Wednesday <br> 1:00 - 3:00</span>
                    <h3 class="card-title">History of Filipino</h3>
                </div>
                
                <div class="card card-full-bg" data-src="homeroom.html" data-query="Home Room" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400&q=80');">
                    <span class="card-tag">Wednesday <br> 3:15 - 3:45</span>
                    <h3 class="card-title">Home Room</h3>
                </div>
            </div>
        </aside>

        <!-- Main Content View -->
        <main class="content-view">
            <header class="content-header">
                <button class="icon-btn" id="toggle-sidebar-btn" title="Toggle Sidebar">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                    </svg>
                </button>
                <h2 class="header-title" id="chat-query">Life And Career Skills</h2>
            </header>

            <div class="iframe-container">
                <iframe id="content-frame" src="life_career.html" title="Lesson Content View" scrolling="yes" frameborder="0"></iframe>
            </div>
        </main>
    </div>

    <!-- Script -->
    <script>
        const updateHeaderTime = () => {
            const timeElement = document.getElementById('status-time');
            if (!timeElement) return;
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNum = now.getDate();
            timeElement.textContent = `${hours}:${minutes} ${ampm} ${dayName} ${monthName} ${dateNum}`;
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderTime();
            setInterval(updateHeaderTime, 1000);

            const iframe = document.getElementById('content-frame');
            const queryTitle = document.getElementById('chat-query');
            const cards = document.querySelectorAll('.card');
            const sidebar = document.getElementById('sidebar');
            const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');

            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });

            cards.forEach((card) => {
                card.addEventListener('click', function() {
                    cards.forEach((c) => c.classList.remove('active'));
                    this.classList.add('active');
                    const targetSrc = this.getAttribute('data-src');
                    const targetQuery = this.getAttribute('data-query');
                    if (targetSrc) {
                        iframe.src = targetSrc;
                    }
                    if (targetQuery) {
                        queryTitle.textContent = targetQuery;
                    }
                });
            });
        });
    </script>
</body>
</html>
